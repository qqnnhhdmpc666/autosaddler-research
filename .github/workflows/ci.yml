name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check src/autosaddler tests/
      - name: Enforce public scenario boundary
        run: |
          if git grep -I -n -E 'copilot_studio|Copilot Studio|ThinkingBox|Agent17|RalphLoop|/DERA' -- . \
            ':!.github/workflows/ci.yml'; then
            echo "Private scenario material is not allowed in the public repository."
            exit 1
          fi
      - name: Test
        run: uv run python -m pytest tests/ -v --tb=short
      - name: Exercise the public quickstart
        run: |
          uv run --locked --python 3.12 scripts/run_baseline.py smoke --run-id ci-smoke
          uv run --no-sync python -c 'import json, os; from pathlib import Path; p = Path("outputs/v2-template/ci-smoke"); assert json.loads((p / "result.json").read_text())["iterations"] == 1; assert json.loads((p / "experiment.json").read_text())["source_commit"] == os.environ["GITHUB_SHA"]'
      - name: Build distributions
        run: uv build
